# VastHorizon 실행 설정
#
# 검색 품질에 영향을 주는 값은 코드가 아니라 이 파일에서 바꾼다.
# 비교 실험은 이 파일을 복사해 값을 바꾸고 VH_CONFIG 환경변수로 지정한다.

[llm]
# OpenAI 호환 엔드포인트 (키: GMS_KEY). 다른 엔드포인트를 쓰려면 base_url과 모델 이름을 바꾼다.
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"
chat_model = "gpt-6-luna"
embedding_model = "text-embedding-3-small"
timeout_sec = 60
# 아래는 provider = "anthropic"일 때만 쓴다 (config.deploy.toml과 같은 값)
# 답변 모델(사용자에게 보이는 긴 글: 질의응답 · 편지 · 마음 한 줄 · 별자리 펼치기 · 하늘 안내)과
# 구조화 모델(짧은 JSON: 검색어 추출 · 후보 선별 · 조건 탐색 필터 · 선별 · 마음 한 줄 분류)을 나눈다
anthropic_model = "claude-sonnet-5-5"
anthropic_fast_model = "claude-haiku-5-5"   # 비우면 답변 모델을 쓴다
# output_config.effort (low · medium · high · xhigh · max, 비우면 모델 기본값). effort를 모르는 모델에는 보내지 않는다
answer_effort = "medium"
fast_effort = "low"

[paths]
data_dir = "data"
chroma_dir = "data/chroma"
cache_dir = "data/cache"

[collections]
items = "cosmos_items"   # 항목 메타데이터 — 항목당 1청크
docs = "cosmos_docs"     # 외부 문서 청크
perspective = "cosmos_perspective"   # 관점 전환 서가 문서 청크

[chunking]
chunk_size = 1000
chunk_overlap = 200

[retrieval]
search_type = "similarity"   # "similarity" | "mmr"
top_k_docs = 6               # 외부 문서 청크 근거 수 (항목 청크 1건은 항상 별도 포함)
mmr_fetch_k = 30             # MMR 후보 수
mmr_lambda = 0.5             # 1에 가까울수록 관련성, 0에 가까울수록 다양성
item_candidates = 20         # 조건 탐색에서 LLM에 넘길 항목 후보 수

[collect]
max_queries = 4              # 프롬프트 1이 뽑을 검색어 수 (항목 이름은 별도로 항상 포함)
candidates_per_query = 5     # 검색어마다 가져올 후보 수
max_selected = 4             # 프롬프트 2가 한 번에 고를 문서 수
min_summary_chars = 40       # 요약이 이보다 짧은 후보는 선별 전에 뺀다 (항목 자체 문서는 예외)
min_doc_chars = 200          # 본문이 이보다 짧으면 색인하지 않는다 (항목 자체 문서는 예외)
max_doc_chars = 20000        # 문서 본문 최대 길이 — 넘으면 자른다 (임베딩 토큰 절약)

[http]
app_name = "VastHorizon/0.1"
min_interval_sec = 0.5   # 같은 호스트에 대한 최소 호출 간격
max_retries = 4
timeout_sec = 30

# AI 호출 한도 — 이 설정에서는 꺼 둔다. 하루 예산(daily_cost_usd)은 enabled와 관계없이 적용된다
[limits]
enabled = false
daily_cost_usd = 3.3

# LLM 호출 기록 (vasthorizon/usage.py) — 호출마다 모델 · 용도 · 토큰 · 소요 시간 · 추정 비용을 JSONL 한 줄로. 프롬프트 · 응답 본문은 남기지 않는다
# 오늘(한국 시각) 합계는 /api/health의 usage에 나온다
[usage]
enabled = true
log_path = "data/cache/usage.jsonl"

# 모델 가격 ($/100만 토큰, 2026-10 Anthropic API 기준). cache_read · cache_write를 비우면 입력 단가의 0.1배 · 1.25배
# Haiku 5.5는 프롬프트가 10만 토큰 이하일 때 가격이다 (넘으면 입력 $0.50 · 출력 $2.50 — 이 앱의 호출은 넘지 않는다)
# 표에 없는 모델(예: OpenAI 호환 엔드포인트의 모델)은 비용 0으로 센다 — 하루 예산도 그 호출은 세지 않는다
[usage.prices.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

[usage.prices.claude-haiku-5-5]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

# 서버 응답 캐시 (vasthorizon/cache.py) — 같은 요청이면 LLM을 부르지 않고 저장한 응답을 돌려준다 (호출 한도 · 하루 예산도 쓰지 않는다)
# 모델 · effort · 프롬프트 파일 · 항목 카탈로그가 바뀌면 키가 달라져 예전 응답은 쓰지 않는다. 비우려면 dir 폴더를 지운다
[cache]
enabled = true
dir = "data/cache/responses"
memory_items = 512
explore_days = 7          # 조건 탐색 결과
letter_days = 7           # 빛의 편지 (항목별 — 나이로 찾은 별도 같은 항목이면 같은 편지)
unfold_days = 30          # 별자리 펼치기 설명
perspective_days = 1      # 마음 한 줄 (키는 문장의 해시)
ask_days = 7              # 질의응답 답변 (대화 기록이 없는 첫 질문만)
ask_live_days = 1         # 근거에 오늘 기준 실시간 위치 · 거리가 들어간 답변
