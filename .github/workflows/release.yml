name: Release (GHCR -> API host -> web host)

# main에 서비스 코드가 바뀌면 ARM64 image를 build해 GHCR에 올리고, API 호스트의 컨테이너를
# 교체한 다음 Nginx 호스트의 정적 화면을 갱신한다. 순서를 API 먼저로 둔 이유는, 새 화면이 새 API에
# 기대는 경우가 많고 API 교체가 실패하면 화면을 건드리지 않고 멈추기 위해서다.
#
#   build       ubuntu-24.04-arm에서 linux/arm64 image를 build하고 push한다.
#   deploy-api  API 호스트에 deploy.sh와 compose 파일을 올리고 digest로 고정한 참조를 배포한다.
#               health 확인, 실패 시 되돌리기는 deploy/vm2/deploy.sh가 담당한다.
#   deploy-web  Nginx 호스트에 web/을 rsync하고 Cloudflare를 거치지 않는 원본 경로로 확인한다.
#
# 되돌리기: workflow_dispatch의 image_ref에 이전 커밋의 sha- 태그를 넣는다.
#   ghcr.io/bnbong/vasthorizon:sha-1a2b3c4
# 이때 build를 건너뛰고 그 image로 API 호스트를 배포하며, 화면도 같은 커밋의 web/으로 맞춘다.
# 자세한 절차는 docs/deploy.md 5절을 따른다.
#
# 서버 경로는 저장소에 적지 않고 production environment의 variable로 받는다.
#   VM2_DEPLOY_DIR  API 호스트에서 compose 파일, .env, deploy.sh가 있는 디렉터리
#   VM1_WEB_DIR     Nginx 호스트에서 정적 화면을 내보내는 디렉터리
#   KAKAO_JS_KEY    카카오톡 공유용 JavaScript 키 (선택). deploy-web이 올리기 전에 복사본의 index.html meta에 넣는다
# 값이 비어 있으면 엉뚱한 경로에 배포하지 않도록 각 job의 첫 단계에서 멈춘다.

on:
  push:
    branches: [ main ]
    paths:
      - 'vasthorizon/**'
      - 'scripts/**'
      - 'web/**'
      - 'data/items.json'
      - 'data/constellations.json'
      - 'data/sky_stars.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'config*.toml'
      - 'deploy/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      image_ref:
        description: '배포할 image 참조 (비우면 현재 커밋을 build한다. 되돌릴 때는 ghcr.io/bnbong/vasthorizon:sha-<7자리>)'
        required: false
        default: ''

permissions:
  contents: read

# 두 서버를 동시에 고치는 실행을 직렬화한다. 진행 중인 배포를 끊으면 .env와
# 컨테이너가 중간 상태로 남을 수 있으므로 취소하지 않고 기다린다.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bnbong/vasthorizon

jobs:
  build:
    name: Build and push ARM64 image
    # image_ref를 받은 workflow_dispatch(되돌리기)에서는 build하지 않는다.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_ref == '' }}
    # API 호스트가 ARM64(aarch64)이므로 네이티브 ARM 러너에서 build한다. QEMU 에뮬레이션이 필요 없다.
    runs-on: ubuntu-24.04-arm
    # image에 임베딩 모델(약 2.2GB) layer가 들어 있다. 캐시가 비어 있으면 모델을 받고
    # layer를 push하는 데 오래 걸리므로 시간을 넉넉히 둔다.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Resolve image tags
      id: meta
      run: |
        set -euo pipefail
        short_sha="${GITHUB_SHA::7}"
        echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
        {
          echo "tags<<EOF"
          echo "${IMAGE_NAME}:sha-${short_sha}"
          echo "${IMAGE_NAME}:main"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 모델 layer는 requirements와 scripts가 바뀌지 않으면 캐시에서 다시 쓴다.
    # 캐시(type=gha)는 저장소당 용량 상한이 있어 모델 layer가 밀려나면 처음부터 받는다.
    # provenance를 끄면 GHCR에 단일 플랫폼 manifest 하나만 올라가고, 출력 digest가
    # API 호스트가 pull하는 image의 digest와 그대로 일치한다.
    - name: Build and push
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
      run: |
        set -euo pipefail
        {
          echo "### Image"
          echo "- \`${IMAGE_NAME}@${DIGEST}\`"
          echo "- \`${IMAGE_NAME}:sha-${SHORT_SHA}\` (되돌릴 때 이 태그를 workflow_dispatch에 넣는다)"
        } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Deploy API
    needs: build
    # build가 건너뛰어진 되돌리기 실행에서도 배포해야 하므로 조건을 직접 적는다.
    if: >-
      ${{ !cancelled() && (
        needs.build.result == 'success' ||
        (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_ref != '')
      ) }}
    runs-on: ubuntu-latest
    environment: production
    # 첫 기동이나 임베딩 모델 변경 뒤에는 색인을 다시 만드느라 health가 15분 가까이 걸린다.
    # deploy.sh는 새 image와 되돌린 image를 각각 최대 1000초씩 기다린다.
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      VM2_HOST: ${{ secrets.VM2_HOST }}
      DEPLOY_DIR: ${{ vars.VM2_DEPLOY_DIR }}
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}

    steps:
    - name: Check deploy settings
      run: |
        set -euo pipefail
        # 기본값을 두지 않는다. 값이 없거나 형식이 다르면 아무것도 올리지 않고 멈춘다.
        # 이 값은 SSH 원격 명령의 작은따옴표 안에 들어가므로 허용 문자를 좁힌다.
        if [ -z "${DEPLOY_DIR:-}" ]; then
          echo "::error::production environment의 variable VM2_DEPLOY_DIR가 비어 있습니다. API 호스트의 배포 디렉터리를 등록한 뒤 다시 실행합니다."
          exit 1
        fi
        if ! printf '%s' "$DEPLOY_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
          echo "::error::VM2_DEPLOY_DIR는 영문, 숫자, '.', '_', '-', '/'로만 이루어진 절대 경로여야 합니다."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Resolve image reference
      id: ref
      env:
        INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        BUILD_DIGEST: ${{ needs.build.outputs.digest }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_IMAGE_REF:-}" ]; then
          ref="$INPUT_IMAGE_REF"
        else
          if [ -z "${BUILD_DIGEST:-}" ]; then
            echo "::error::build job이 digest를 넘기지 않았습니다."
            exit 1
          fi
          ref="${IMAGE_NAME}@${BUILD_DIGEST}"
        fi

        # 이 값은 SSH 원격 명령에 그대로 들어가므로 deploy.sh와 같은 규칙으로 먼저 거른다.
        if ! printf '%s' "$ref" | grep -Eq '^ghcr\.io/bnbong/vasthorizon(@sha256:[0-9a-f]{64}|:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})$'; then
          echo "::error::image 참조 형식이 올바르지 않습니다: $ref"
          echo "::error::ghcr.io/bnbong/vasthorizon@sha256:<64자리> 또는 ghcr.io/bnbong/vasthorizon:<tag> 형식이어야 합니다."
          exit 1
        fi
        echo "image_ref=$ref" >> "$GITHUB_OUTPUT"
        echo "배포 대상: $ref"

    - name: Configure SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VM2_SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.VM2_SSH_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Upload deploy files
      run: |
        set -euo pipefail
        # .env와 docker-compose.override.yml은 서버에서만 관리하므로 올리지 않는다. 임시 이름으로 올린 뒤 mv로 바꿔서,
        # 전송 도중에 끊겨도 반쯤 쓴 compose 파일이나 스크립트가 남지 않게 한다.
        scp -i ~/.ssh/id_deploy deploy/vm2/deploy.sh \
          "ubuntu@${VM2_HOST}:${DEPLOY_DIR}/.deploy.sh.incoming"
        scp -i ~/.ssh/id_deploy deploy/vm2/docker-compose.yml \
          "ubuntu@${VM2_HOST}:${DEPLOY_DIR}/.docker-compose.yml.incoming"
        ssh -i ~/.ssh/id_deploy "ubuntu@${VM2_HOST}" \
          "set -e; cd '${DEPLOY_DIR}'; chmod 755 .deploy.sh.incoming; chmod 644 .docker-compose.yml.incoming; mv -f .deploy.sh.incoming deploy.sh; mv -f .docker-compose.yml.incoming docker-compose.yml"

    - name: Deploy image
      env:
        IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
      run: |
        set -euo pipefail
        # 종료 코드: 0 성공, 1 실패했으나 이전 image로 복구, 2 인자 오류, 3 복구도 실패(서비스 중단)
        set +e
        ssh -i ~/.ssh/id_deploy "ubuntu@${VM2_HOST}" \
          "env DEPLOY_DIR='${DEPLOY_DIR}' bash '${DEPLOY_DIR}/deploy.sh' '${IMAGE_REF}'"
        rc=$?
        set -e
        case "$rc" in
          0)
            echo "API 배포를 완료했습니다: $IMAGE_REF"
            ;;
          1)
            echo "::error::API 배포가 실패했고 이전 image로 되돌렸습니다. API 호스트의 ${DEPLOY_DIR}/deploy-failures/ 기록을 확인하시기 바랍니다."
            exit 1
            ;;
          3)
            echo "::error::API 배포가 실패했고 이전 image도 health 확인을 통과하지 못했습니다. 서비스가 중단된 상태이므로 즉시 조치해야 합니다."
            echo "::error::API 호스트에서 ${DEPLOY_DIR}/deploy-failures/ 기록과 docker compose logs를 확인하시기 바랍니다."
            exit 3
            ;;
          *)
            echo "::error::deploy.sh가 종료 코드 ${rc}로 끝났습니다."
            exit "$rc"
            ;;
        esac

    - name: Remove SSH key
      if: always()
      run: |
        set -euo pipefail
        rm -f ~/.ssh/id_deploy

  deploy-web:
    name: Deploy web
    needs: deploy-api
    if: ${{ !cancelled() && needs.deploy-api.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VM1_HOST: ${{ secrets.VM1_HOST }}
      WEB_DIR: ${{ vars.VM1_WEB_DIR }}
      SITE_HOST: vasthorizon.bnbong.com
      INPUT_IMAGE_REF: ${{ inputs.image_ref }}

    steps:
    - name: Check deploy settings
      run: |
        set -euo pipefail
        # rsync --delete의 대상이므로 기본값을 두지 않는다. 값이 없으면 아무것도 지우지 않고 멈춘다.
        if [ -z "${WEB_DIR:-}" ]; then
          echo "::error::production environment의 variable VM1_WEB_DIR가 비어 있습니다. Nginx 호스트의 정적 화면 디렉터리를 등록한 뒤 다시 실행합니다."
          exit 1
        fi
        if ! printf '%s' "$WEB_DIR" | grep -Eq '^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+/?$'; then
          echo "::error::VM1_WEB_DIR는 두 단계 이상의 절대 경로여야 하며 영문, 숫자, '.', '_', '-', '/'만 쓸 수 있습니다."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # 되돌리기 실행에서 sha- 태그에 맞는 커밋의 web/을 꺼내려면 이력이 필요하다.
        fetch-depth: 0

    - name: Select web revision
      run: |
        set -euo pipefail
        # 되돌리기 실행이면 API image와 같은 커밋의 화면을 올린다. sha- 태그에서 커밋을
        # 알아낼 수 없는 참조(digest, main 등)는 현재 커밋의 web/을 그대로 쓴다.
        if [[ "${INPUT_IMAGE_REF:-}" =~ :sha-([0-9a-f]{7})$ ]]; then
          rev="${BASH_REMATCH[1]}"
          if ! git rev-parse --verify --quiet "${rev}^{commit}" >/dev/null; then
            echo "::error::image 태그의 커밋 ${rev}를 저장소에서 찾지 못했습니다."
            exit 1
          fi
          git checkout --quiet --detach "$rev"
          echo "web/을 커밋 $(git rev-parse --short HEAD)에서 올립니다."
        elif [ -n "${INPUT_IMAGE_REF:-}" ]; then
          echo "::warning::image_ref(${INPUT_IMAGE_REF})에서 커밋을 알 수 없어 현재 커밋 $(git rev-parse --short HEAD)의 web/을 올립니다."
        else
          echo "web/을 커밋 $(git rev-parse --short HEAD)에서 올립니다."
        fi

    - name: Prepare web/ copy with Kakao key
      env:
        # 화면에 그대로 실리는 공개 키라 secret이 아니라 variable로 둔다.
        KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
      run: |
        set -euo pipefail
        # 카카오 JavaScript 키는 저장소의 index.html에 적지 않는다. 작업 복사본(web/)은 그대로 두고
        # 임시 디렉터리에 복사한 뒤 그 index.html의 vh-kakao-key meta만 바꾼다. 키 값은 로그에 남기지 않는다.
        dest="${RUNNER_TEMP}/web"
        rm -rf "$dest"
        cp -a web "$dest"
        index="${dest}/index.html"
        meta_count="$(grep -c '<meta name="vh-kakao-key" content="">' "$index" || true)"
        if [ "${meta_count:-0}" != "1" ]; then
          echo "::error::index.html에서 빈 vh-kakao-key meta를 정확히 하나 찾지 못했습니다 (${meta_count:-0}개)."
          exit 1
        fi
        if [ -z "${KAKAO_JS_KEY:-}" ]; then
          echo "::warning::production environment의 variable KAKAO_JS_KEY가 비어 있어 카카오톡 공유 버튼을 숨긴 채로 올립니다."
        else
          # 키는 영문·숫자(16진수)뿐이어야 sed 치환식과 HTML 속성에 그대로 넣어도 안전하다.
          if ! printf '%s' "$KAKAO_JS_KEY" | grep -Eq '^[A-Za-z0-9]{1,64}$'; then
            echo "::error::KAKAO_JS_KEY는 영문과 숫자로만 된 카카오 JavaScript 키여야 합니다."
            exit 1
          fi
          sed -i "s|<meta name=\"vh-kakao-key\" content=\"\">|<meta name=\"vh-kakao-key\" content=\"${KAKAO_JS_KEY}\">|" "$index"
          if [ "$(grep -c "<meta name=\"vh-kakao-key\" content=\"${KAKAO_JS_KEY}\">" "$index" || true)" != "1" ]; then
            echo "::error::index.html의 vh-kakao-key meta에 키를 넣지 못했습니다."
            exit 1
          fi
          echo "index.html의 vh-kakao-key meta에 카카오 JavaScript 키를 넣었습니다."
        fi
        echo "WEB_SRC=${dest}" >> "$GITHUB_ENV"

    - name: Configure SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VM1_SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.VM1_SSH_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Sync web/ to Nginx host
      run: |
        set -euo pipefail
        # Nginx 설정은 이 저장소가 관리하지 않으므로 정적 파일만 바꾼다. 경로가 그대로라
        # reload가 필요 없다. 검증용 페이지(_*.html)와 __pycache__는 올리지 않는다.
        # 올리는 것은 카카오 키를 넣은 복사본(WEB_SRC, 앞 단계)이다.
        rsync -az --delete -e "ssh -i $HOME/.ssh/id_deploy" \
          --exclude '_*.html' --exclude '__pycache__' \
          "${WEB_SRC:?}/" "ubuntu@${VM1_HOST}:${WEB_DIR%/}/"

    - name: Origin check on Nginx host
      run: |
        set -euo pipefail
        # --resolve로 Cloudflare를 거치지 않고 Nginx 호스트 루프백의 Nginx에 직접 요청한다.
        # 원본 인증서는 공개 CA 체인으로 검증되지 않을 수 있으므로 -k를 쓴다.
        # /api/health는 Nginx를 지나 API 호스트까지 가므로 프록시 경로도 함께 확인된다.
        if ssh -i ~/.ssh/id_deploy "ubuntu@${VM1_HOST}" "bash -s -- ${SITE_HOST}" <<'REMOTE'
        set -euo pipefail
        host="$1"
        failed=0
        for path in / /api/health; do
          code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 \
            --resolve "${host}:443:127.0.0.1" "https://${host}${path}" || true)"
          if [ "${code:-000}" = "200" ]; then
            echo "  origin https://${host}${path} -> 200"
          else
            echo "::error::origin https://${host}${path} -> ${code:-000} (기대한 코드: 200)"
            failed=1
          fi
        done
        exit "$failed"
        REMOTE
        then
          echo "오리진 확인을 모두 통과했습니다."
        else
          echo "::error::오리진 확인이 실패했습니다. API 호스트의 컨테이너는 이미 새 image로 바뀌었습니다."
          echo "::error::되돌리기: Actions에서 이 워크플로를 workflow_dispatch로 실행하고 image_ref에 이전 커밋의 태그(ghcr.io/bnbong/vasthorizon:sha-<7자리>)를 넣습니다. API와 화면이 함께 그 커밋으로 돌아갑니다."
          exit 1
        fi

    # 공개 경로 확인은 참고 정보이며 이 단계는 배포를 실패시키지 않는다. 러너가
    # Cloudflare 챌린지(403)를 받으면 원본과 무관한 응답이 돌아오기 때문이다.
    - name: Public path check through Cloudflare (reference only)
      run: |
        set -euo pipefail
        for path in / /api/health; do
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://${SITE_HOST}${path}" || true)"
          echo "  https://${SITE_HOST}${path} -> ${code:-000} (참고)"
        done

    - name: Remove SSH key
      if: always()
      run: |
        set -euo pipefail
        rm -f ~/.ssh/id_deploy
