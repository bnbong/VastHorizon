# VastHorizon 배포 설정 — Claude API(개인 키) + 서버 안 로컬 임베딩
#
#     VH_CONFIG=config.deploy.toml
#
# 과제 제출 환경은 config.toml(GMS)을 그대로 쓴다. 이 파일은 공개 배포용이다.
# 색인 · 캐시는 GMS 색인과 섞이지 않게 data/deploy/ 아래에 따로 둔다 (임베딩 모델이 달라 벡터를 함께 쓸 수 없다).

[llm]
provider = "anthropic"                   # 채팅: Claude (키: CLAUDE_API_KEY)
anthropic_model = "claude-sonnet-5-5"    # 비용을 줄이려면 "claude-haiku-5-5"
max_tokens = 2048
timeout_sec = 60
embedding_provider = "local"             # Claude에는 임베딩 API가 없어 서버 안에서 계산한다 (fastembed, ONNX)
# 다국어 모델. 한국어 질문 4개로 비교했을 때 정답 청크 순위: e5-large [1, 1, 1, 1], mpnet-base [17, 1, 9, 2], MiniLM [12, 2, 1, 1]
# 근거 순위가 다소 떨어지지만(한 질문은 12위) 공개 서버의 CPU로는 이 속도가 필요하다. 청크(1,000자, 배치 16) 하나를 임베딩하는 시간은
# VM2(Oracle A1 ARM 2코어)에서 e5-large 5.3초, mpnet-base 1.6초, MiniLM 0.15초였다. e5-large는 문서가 긴 천체의 첫 질문에 5분 넘게 걸려
# 비스트리밍 요청이 Nginx 120초 제한에서 504로 끝났다. e5-large(2.2GB · 메모리 약 2.5GB)는 GPU나 빠른 x86 서버에서 쓴다
# local_embedding_model = "intfloat/multilingual-e5-large"
# 모델을 바꾸면 scripts/deploy_init.py가 실행할 때 알아채고 항목 · 서가 · 문서 색인을 모두 새 모델로 다시 만든다
local_embedding_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"   # 0.22GB, 384차원
# 한 번에 임베딩할 문서 수. fastembed 기본값(256)으로 e5-large 서가 색인을 만들 때 컨테이너 메모리가 6.4GB까지 올랐고,
# 메모리 상한 4GB에서는 항목 색인 도중 프로세스가 죽었다(OOM). 배치를 줄여도 결과 벡터는 같고 시간만 조금 늘어난다
local_embedding_batch_size = 16
# 아래 셋은 gms 제공자용 — 배포에서는 쓰지 않는다
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"
chat_model = "gpt-6-luna"
embedding_model = "text-embedding-3-small"

[paths]
data_dir = "data"
chroma_dir = "data/deploy/chroma"
cache_dir = "data/deploy/cache"

[collections]
items = "cosmos_items"
docs = "cosmos_docs"
perspective = "cosmos_perspective"

[chunking]
chunk_size = 1000
chunk_overlap = 200

[retrieval]
search_type = "similarity"
top_k_docs = 6
mmr_fetch_k = 30
mmr_lambda = 0.5
item_candidates = 20

[collect]
max_queries = 4
candidates_per_query = 5
max_selected = 4
min_summary_chars = 40
min_doc_chars = 200
max_doc_chars = 20000

[http]
app_name = "VastHorizon/0.1"
min_interval_sec = 0.5
max_retries = 4
timeout_sec = 30

# 공개 배포 — 개인 API 키를 지키는 AI 호출 한도 (실제로 LLM을 부르는 요청만 센다. 하늘 계산 · 조회는 세지 않는다)
# 사용자 주소: 리버스 프록시 뒤라면 환경변수 FORWARDED_ALLOW_IPS(Uvicorn)에 그 프록시의 주소(IP · CIDR)만 적는다.
# 그 프록시에서 온 연결만 X-Forwarded-For를 오른쪽부터 읽고, 직접 들어온 연결의 전달 헤더는 무시한다
[limits]
enabled = true
per_ip_per_minute = 6
per_ip_per_day = 60
global_per_day = 1500

# 화면을 다른 주소(Cloudflare Pages 등)에 둘 때 허용할 출처. 환경변수 VH_CORS_ORIGINS(쉼표 구분)가 있으면 그 값을 쓴다
[server]
cors_origins = []
