# VastHorizon 배포 설정 — Claude API(개인 키) + 서버 안 로컬 임베딩
#
#     VH_CONFIG=config.deploy.toml
#
# 기본 실행 · 공개 배포용 설정이다. 다른 OpenAI 호환 API를 쓰려면 config.toml을 쓴다.
# 색인 · 캐시는 config.toml 색인과 섞이지 않게 data/deploy/ 아래에 따로 둔다 (임베딩 모델이 달라 벡터를 함께 쓸 수 없다).

[llm]
provider = "anthropic"                   # 채팅: Claude (키: CLAUDE_API_KEY)
# 답변 모델(사용자에게 보이는 긴 글: 질의응답 · 편지 · 마음 한 줄 · 별자리 펼치기 · 하늘 안내)과
# 구조화 모델(짧은 JSON: 검색어 추출 · 후보 선별 · 조건 탐색 필터 · 선별 · 마음 한 줄 분류)을 나눈다
anthropic_model = "claude-sonnet-5-5"
anthropic_fast_model = "claude-haiku-5-5"   # 비우면 답변 모델을 쓴다
# output_config.effort (low · medium · high · xhigh · max, 비우면 모델 기본값). effort를 모르는 모델에는 보내지 않는다
answer_effort = "medium"
fast_effort = "low"
max_tokens = 2048
timeout_sec = 60
embedding_provider = "local"             # Claude에는 임베딩 API가 없어 서버 안에서 계산한다 (fastembed, ONNX)
# 다국어 모델. 한국어 질문 4개로 비교했을 때 정답 청크 순위: e5-large [1, 1, 1, 1], mpnet-base [17, 1, 9, 2], MiniLM [12, 2, 1, 1]
# 근거 순위가 다소 떨어지지만(한 질문은 12위) 공개 서버의 CPU로는 이 속도가 필요하다. 청크(1,000자, 배치 16) 하나를 임베딩하는 시간은
# ARM 2코어 서버에서 e5-large 5.3초, mpnet-base 1.6초, MiniLM 0.15초였다. e5-large는 문서가 긴 천체의 첫 질문에 5분 넘게 걸려
# 비스트리밍 요청이 Nginx 120초 제한에서 504로 끝났다. e5-large(2.2GB · 메모리 약 2.5GB)는 GPU나 빠른 x86 서버에서 쓴다
# local_embedding_model = "intfloat/multilingual-e5-large"
# 모델을 바꾸면 scripts/deploy_init.py가 실행할 때 알아채고 항목 · 서가 · 문서 색인을 모두 새 모델로 다시 만든다
local_embedding_model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"   # 0.22GB, 384차원
# 한 번에 임베딩할 문서 수. fastembed 기본값(256)으로 e5-large 서가 색인을 만들 때 컨테이너 메모리가 6.4GB까지 올랐고,
# 메모리 상한 4GB에서는 항목 색인 도중 프로세스가 죽었다(OOM). 배치를 줄여도 결과 벡터는 같고 시간만 조금 늘어난다
local_embedding_batch_size = 16
# 아래 셋은 gms 제공자용 — 배포에서는 쓰지 않는다
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"
chat_model = "gpt-6-luna"
embedding_model = "text-embedding-3-small"

[paths]
data_dir = "data"
chroma_dir = "data/deploy/chroma"
cache_dir = "data/deploy/cache"

[collections]
items = "cosmos_items"
docs = "cosmos_docs"
perspective = "cosmos_perspective"

[chunking]
chunk_size = 1000
chunk_overlap = 200

[retrieval]
search_type = "similarity"
top_k_docs = 6
mmr_fetch_k = 30
mmr_lambda = 0.5
item_candidates = 20

[collect]
max_queries = 4
candidates_per_query = 5
max_selected = 4
min_summary_chars = 40
min_doc_chars = 200
max_doc_chars = 20000

[http]
app_name = "VastHorizon/0.1"
min_interval_sec = 0.5
max_retries = 4
timeout_sec = 30

# 공개 배포 — 개인 API 키를 지키는 AI 호출 한도 (실제로 LLM을 부르는 요청만 센다. 하늘 계산 · 조회는 세지 않는다)
# 사용자 주소: 리버스 프록시 뒤라면 환경변수 FORWARDED_ALLOW_IPS(Uvicorn)에 그 프록시의 주소(IP · CIDR)만 적는다.
# 그 프록시에서 온 연결만 X-Forwarded-For를 오른쪽부터 읽고, 직접 들어온 연결의 전달 헤더는 무시한다
[limits]
enabled = true
per_ip_per_minute = 6
per_ip_per_day = 60
global_per_day = 1500
daily_cost_usd = 3.3                     # 하루(한국 시각) 추정 비용 상한 — 넘으면 LLM 요청에 429 (월 $100 기준). 0이면 끈다

# 화면을 다른 주소(Cloudflare Pages 등)에 둘 때 허용할 출처. 환경변수 VH_CORS_ORIGINS(쉼표 구분)가 있으면 그 값을 쓴다
[server]
cors_origins = []

# LLM 호출 기록 (vasthorizon/usage.py) — 호출마다 모델 · 용도 · 토큰 · 소요 시간 · 추정 비용을 JSONL 한 줄로. 프롬프트 · 응답 본문은 남기지 않는다
# 오늘(한국 시각) 합계는 /api/health의 usage에 나온다
[usage]
enabled = true
log_path = "data/deploy/usage.jsonl"

# 모델 가격 ($/100만 토큰, 2026-10 Anthropic API 기준). cache_read · cache_write를 비우면 입력 단가의 0.1배 · 1.25배
# Haiku 5.5는 프롬프트가 10만 토큰 이하일 때 가격이다 (넘으면 입력 $0.50 · 출력 $2.50 — 이 앱의 호출은 넘지 않는다)
# 표에 없는 모델(예: OpenAI 호환 엔드포인트의 모델)은 비용 0으로 센다 — 하루 예산도 그 호출은 세지 않는다
[usage.prices.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.2
cache_write = 2.5

[usage.prices.claude-haiku-5-5]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

# 서버 응답 캐시 (vasthorizon/cache.py) — 같은 요청이면 LLM을 부르지 않고 저장한 응답을 돌려준다 (호출 한도 · 하루 예산도 쓰지 않는다)
# 모델 · effort · 프롬프트 파일 · 항목 카탈로그가 바뀌면 키가 달라져 예전 응답은 쓰지 않는다. 비우려면 dir 폴더를 지운다
[cache]
enabled = true
dir = "data/deploy/cache/responses"
memory_items = 512
explore_days = 7          # 조건 탐색 결과
letter_days = 7           # 빛의 편지 (항목별 — 나이로 찾은 별도 같은 항목이면 같은 편지)
unfold_days = 30          # 별자리 펼치기 설명
perspective_days = 1      # 마음 한 줄 (키는 문장의 해시)
ask_days = 7              # 질의응답 답변 (대화 기록이 없는 첫 질문만)
ask_live_days = 1         # 근거에 오늘 기준 실시간 위치 · 거리가 들어간 답변

# 편지 공유 (vasthorizon/share.py) — 서버 응답 캐시에 있는 빛의 편지 · 마음 한 줄만 링크(/api/l/<id>)로 남긴다
# 마음 한 줄은 사용자 문장을 저장하지 않는다 (답 · 주제 · 근거만). 링크 주소는 환경변수 VH_PUBLIC_BASE가 있으면 그 값
[share]
dir = "data/deploy/share"
days = 180                # 공유 링크 보관 기간 — 지나면 시작할 때와 하루 한 번 지운다
public_base = "https://vasthorizon.bnbong.com"
per_ip_per_minute = 20    # 공유 링크 만들기 한도 (AI 호출 한도 · 하루 예산과 별도)
max_records = 20000       # 보관하는 공유 기록 상한 — 넘치면 새 공유는 503 share_unavailable

# 편지 읽어 주기 (vasthorizon/tts.py) — 공유한 편지를 Google Cloud Text-to-Speech로 읽은 MP3 (/api/l/<id>/audio.mp3)
# 키는 환경변수 GOOGLE_TTS_API_KEY에만 둔다. 키가 없거나 한도를 다 쓰면 화면은 기기 음성(speechSynthesis)으로 읽는다
[tts]
enabled = true
voice = "ko-KR-Chirp3-HD-Aoede"
speaking_rate = 0.95
dir = "data/deploy/tts"
days = 30                 # 만든 오디오 보관 기간 — 지나면 시작할 때와 하루 한 번 지운다
monthly_chars = 900000    # 이달(한국 시각) 합성 글자 수 상한 — Google 무료 100만 자 아래로 여유를 둔다
daily_chars = 60000       # 오늘(한국 시각) 합성 글자 수 상한
per_ip_per_minute = 10    # 합성 요청 한도 (캐시 적중은 세지 않는다)
timeout = 20              # Google 호출 하나의 제한 시간(초)
